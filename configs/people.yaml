# Demonstration geometry picked from video_002.avi (1200x1100), not a legal restriction.
model:
  weights: models/yolo11n.pt
  confidence: 0.25
  imgsz: 640
  classes: [person, car, motorcycle, bus, truck]
  device: "0"
  torch_threads: 2
  batch_size: 4
  batch_wait_ms: 5
streaming:
  enabled: false
  output_fps: 12
database:
  path: data/database/people.db
  snapshot_dir: data/snapshots/people
logging:
  file: logs/people.log
cameras:
  - id: cam05-crosswalk
    output_path: crosswalk-people
    source:
      type: file
      uri: data/videos/pedestrians/crosswalk-video002-180s.mp4
      loop: true
    line:
      id: crosswalk_two_way
      start: [550, 170]
      end: [550, 325]
      deadband_px: 6
      cooldown_seconds: 0.75
    counting_region:
      id: crosswalk_count_75_demo
      points: [[133, 183], [747, 176], [762, 310], [128, 311]]
    forbidden_zones:
      - id: crosswalk_alert_25_demo
        points: [[747, 176], [952, 174], [973, 310], [762, 310]]
    tracker_iou_threshold: 0.15
    tracker_max_missed: 8
