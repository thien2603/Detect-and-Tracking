model:
  weights: models/yolo11n.pt
  confidence: 0.25
  imgsz: 480
  classes:
  - person
  - car
  - motorcycle
  - bus
  - truck
  device: '0'
  torch_threads: 2
  batch_size: 4
  batch_wait_ms: 15
  async_inference: true
  detect_interval: 2
  half: true
  rect: false
streaming:
  enabled: false
  output_fps: 14
  max_output_width: 960
  max_output_height: 540
  max_frame_age_ms: 700
  encoder: auto
database:
  path: data/database/submission.db
  snapshot_dir: data/snapshots/submission
