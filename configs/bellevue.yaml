# Approved 75/25 image-area layout. Red zones are demonstration alerts only.
# No detection_region filter: track approaches too, so entry into green is observable.
model:
  weights: models/yolo11n.pt
  confidence: 0.25
  imgsz: 640
  classes: [person, car, motorcycle, bus, truck]
  device: "0"
  torch_threads: 2
  batch_size: 8
  batch_wait_ms: 5
streaming:
  enabled: false
  output_fps: 30
database:
  path: data/database/bellevue.db
  snapshot_dir: data/snapshots/bellevue
logging:
  file: logs/bellevue.log
cameras:
  - id: cam01-eastgate
    source: {type: file, uri: data/videos/bellevue/cam01-eastgate-180s.mp4, loop: false}
    output_path: bellevue/eastgate
    line:
      id: two_way_count
      start: [232, 322]
      end: [676, 374]
      deadband_px: 6
    counting_region:
      id: count_75
      points: [[327, 180], [714, 219], [639, 530], [137, 464]]
    forbidden_zones:
      - id: alert_25_demo
        points: [[714, 219], [839, 232], [802, 552], [639, 530]]
