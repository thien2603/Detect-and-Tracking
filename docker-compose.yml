services:
  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:8554:8554"
    volumes:
      - ./infrastructure/mediamtx.yml:/mediamtx.yml:ro
  app:
    build: .
    image: tracking-detection:local
    environment:
      CONFIG_PATH: /tmp/runtime/configs/service.yaml
      OPENCV_FFMPEG_CAPTURE_OPTIONS: rtsp_transport;tcp|fflags;nobuffer|flags;low_delay
    command: ["sh", "-c", "python -m scripts.prepare_realtime_config --base configs/docker-cpu.yaml --output /tmp/runtime/configs/service.yaml --device cpu --rtsp-server rtsp://mediamtx:8554 && exec python -m scripts.serve --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./configs:/app/configs:ro
    depends_on:
      - mediamtx
      - replay
  replay:
    image: tracking-detection:local
    build: .
    command: ["python", "-m", "scripts.replay_rtsp", "--config", "configs/docker-cpu.yaml",
              "--server", "rtsp://mediamtx:8554", "--ffmpeg", "ffmpeg", "--fps", "10"]
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./configs:/app/configs:ro
    depends_on:
      - mediamtx
